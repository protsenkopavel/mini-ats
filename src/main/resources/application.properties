quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=8

quarkus.datasource.devservices.port=5434
quarkus.datasource.devservices.db-name=hiring
quarkus.datasource.devservices.username=hiring
quarkus.datasource.devservices.password=hiring
quarkus.datasource.devservices.image-name=postgres:17-alpine

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true

quarkus.log.category."net.protsenko".level=DEBUG
